<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プラごみ品目別 AI判別＆出し方ガイド</title>
  <style>
    /* 全体背景に指定した地球・リサイクル画像を設定 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      box-sizing: border-box;
      /* ★ メイン画面の背景画像 */
      background: url('main-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
    }

    /* --- 🎬 オープニング演出（イラスト画像＋文字が薄くなって消える） --- */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      pointer-events: none;
      /* 最初のオープニング用イラスト */
      background: url('recycle-bg.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1.2s ease-out, visibility 1.2s ease-out;
      opacity: 1;
      visibility: visible;
    }

    .intro-banner {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .intro-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0 0 8px 0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .intro-subtitle {
      color: #e0f2fe;
      font-size: 14px;
      font-weight: bold;
      margin: 0;
    }

    .fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* --- メインカード（背景が透けて見えるすりガラスデザイン） --- */
    .card {
      background: rgba(255, 255, 255, 0.90); /* 半透明にして背景を活かす */
      backdrop-filter: blur(8px);
      max-width: 480px;
      margin: 15px auto;
      padding: 20px 15px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.6);
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.8s ease 0.4s, transform 0.8s ease 0.4s;
    }
    .card.show {
      opacity: 1;
      transform: scale(1);
    }

    .tab-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #008080;
      background-color: white;
      color: #008080;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .tab-btn.active {
      background-color: #008080;
      color: white;
    }
    .preview-area {
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(249, 251, 251, 0.8);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 2px dashed #008080;
    }
    #webcam-container canvas, #image-preview {
      border-radius: 12px;
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
    }
    .file-input-label {
      display: inline-block;
      padding: 10px 22px;
      background-color: #008080;
      color: white;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    input[type="file"] {
      display: none;
    }
    .loading-text {
      font-size: 14px;
      color: #666;
    }
    .result-box {
      margin-top: 15px;
      text-align: left;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
    }
    .badge-plastic {
      background-color: #e6f4f1;
      color: #008080;
    }
    .badge-other {
      background-color: #fde8e8;
      color: #e63946;
    }
    .advice-box {
      background-color: #fff9e6;
      border-left: 4px solid #f59e0b;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      color: #4a3b00;
      margin-top: 10px;
    }
    .advice-box strong {
      color: #b45309;
    }
  </style>
</head>
<body>

<!-- 🎬 オープニング演出 -->
<div id="intro-overlay">
  <div class="intro-banner">
    <h1 class="intro-title">♻️ プラスチックゴミを分別しよう</h1>
    <p class="intro-subtitle">AI判別ガイドを起動しています...</p>
  </div>
</div>

<!-- 📱 メイン画面（背景画像の上に浮かび上がる） -->
<div class="card" id="main-card">
  <h2>♻️ プラごみ AI判別ガイド</h2>
  <p style="font-size:13px; color:#555;">カメラまたは画像から分別区分を判定します。</p>

  <div class="tab-container">
    <button class="tab-btn active" id="tab-camera" onclick="switchMode('camera')">📷 カメラで判定</button>
    <button class="tab-btn" id="tab-upload" onclick="switchMode('upload')">📁 画像を選んで判定</button>
  </div>

  <div id="camera-section">
    <div class="preview-area">
      <div id="loading" class="loading-text">📷 AIモデルとカメラを読み込み中...</div>
      <div id="webcam-container"></div>
    </div>
  </div>

  <div id="upload-section" style="display: none;">
    <label class="file-input-label">
      📁 画像を選択または撮影
      <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)">
    </label>
    <div class="preview-area">
      <img id="image-preview" src="" alt="画像プレビュー" style="display: none;">
      <span id="upload-placeholder" class="loading-text">画像ファイルを選択してください</span>
    </div>
  </div>

  <div id="label-container" class="result-box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
  // ★ ご自身のTeachable MachineモデルURLをここに貼り付けてください（末尾のスラッシュ / を忘れずに）
  const URL = "https://teachablemachine.withgoogle.com/models/fQsdyrL7J/";

  let model, webcam, labelContainer, maxPredictions;
  let isCameraActive = false;

  window.onload = function() {
    // 1.5秒後にオープニング幕をフェードアウト
    setTimeout(function() {
      const overlay = document.getElementById("intro-overlay");
      const mainCard = document.getElementById("main-card");

      if (overlay) overlay.classList.add("fade-out");
      if (mainCard) mainCard.classList.add("show");

      setTimeout(function() {
        if (overlay) overlay.style.display = "none";
      }, 1300);
    }, 1500);

    initModel();
  };

  async function initModel() {
    try {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();
      labelContainer = document.getElementById("label-container");

      startCamera();
    } catch (err) {
      document.getElementById("loading").innerHTML = "⚠️ モデルの読み込みに失敗しました。<br>URL設定を確認してください。";
      console.error(err);
    }
  }

  async function startCamera() {
    try {
      isCameraActive = true;
      const flip = false;
      webcam = new tmImage.Webcam(300, 300, flip);
      await webcam.setup({ facingMode: "environment" });
      await webcam.play();
      window.requestAnimationFrame(loopCamera);

      document.getElementById("loading").style.display = "none";
      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("webcam-container").appendChild(webcam.canvas);
    } catch (err) {
      document.getElementById("loading").innerHTML = "⚠️ カメラが起動できませんでした。<br>カメラの許可を確認してください。";
      console.error(err);
    }
  }

  async function loopCamera() {
    if (!isCameraActive) return;
    webcam.update();
    await predict(webcam.canvas);
    window.requestAnimationFrame(loopCamera);
  }

  function switchMode(mode) {
    const tabCam = document.getElementById("tab-camera");
    const tabUp = document.getElementById("tab-upload");
    const secCam = document.getElementById("camera-section");
    const secUp = document.getElementById("upload-section");
    labelContainer.innerHTML = "";

    if (mode === "camera") {
      tabCam.classList.add("active");
      tabUp.classList.remove("active");
      secCam.style.display = "block";
      secUp.style.display = "none";
      if (!isCameraActive) {
        startCamera();
      }
    } else {
      tabCam.classList.remove("active");
      tabUp.classList.add("active");
      secCam.style.display = "none";
      secUp.style.display = "block";
      isCameraActive = false;
      if (webcam) webcam.stop();
    }
  }

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const imgPreview = document.getElementById("image-preview");
    const placeholder = document.getElementById("upload-placeholder");
    const reader = new FileReader();

    reader.onload = function(e) {
      imgPreview.src = e.target.result;
      imgPreview.style.display = "block";
      placeholder.style.display = "none";

      imgPreview.onload = async function() {
        await predict(imgPreview);
      };
    };
    reader.readAsDataURL(file);
  }

  function getAdviceForClass(className) {
    const name = className.toLowerCase();

    if (name.includes("dvd") || name.includes("cd") || name.includes("co")) {
      return "プラスチックのみ・30cm未満であれば「プラスチック」の日へ。<br>（汚れがない状態で出してください）";
    }
    if (name.includes("ラップ") || name.includes("wrap")) {
      return "水で軽くすすぎ、汚れのない状態で「プラスチック」へ。<br>⚠️ 汚れが取れない場合は「可燃ごみ」へ。";
    }
    if (name.includes("マヨネーズ") || name.includes("mayonnaise") || name.includes("mayo")) {
      return "中身を使い切り、水ですすいで出してください。<br>⚠️ 汚れが取れない場合は「可燃ごみ」へ。";
    }
    if (name.includes("弁当") || name.includes("bento")) {
      return "【30cm未満・プラ単体・汚れなし】であれば「プラスチック」へ。<br>⚠️ 汚れが落ちない・ゴムパッキン等が外れない場合は「可燃ごみ」へ。";
    }
    if (name.includes("キャップ") || name.includes("ラベル") || name.includes("pet") || name.includes("cap")) {
      return "キャップ・ラベルは「プラスチック」へ。<br>ボトル本体は「資源（ペットボトル）」へ。";
    }
    if (name.includes("プチプチ") || name.includes("緩衝材") || name.includes("bubble")) {
      return "機械への巻き付き防止のため、30cm程度に切断して「プラスチック」へ。";
    }
    if (name.includes("フォーク") || name.includes("スプーン") || name.includes("fork")) {
      return "プラスチック100%素材に限ります。（金属等の複合素材は不可）";
    }
    if (name.includes("ひも") || name.includes("紐") || name.includes("string") || name.includes("rope")) {
      return "機械への巻き付き防止のため、30cm程度に切断して「プラスチック」へ。";
    }
    if (name.includes("ハンガー") || name.includes("hanger")) {
      return "プラスチック単体で30cm未満のものに限ります。（フックが金属のものは不可）";
    }
    if (name.includes("歯磨き") || name.includes("チューブ") || name.includes("tube")) {
      return "中身を使い切り、水ですすいで出してください。<br>⚠️ 汚れが取れない場合は「可燃ごみ」へ。";
    }
    if (name.includes("plastic") || name.includes("プラスチック") || name.includes("プラ")) {
      return "水ですすいで汚れを落として「プラスチック」へ。<br>⚠️ 汚れが取れない場合は「可燃ごみ」へ。";
    }
    return null;
  }

  async function predict(imageElement) {
    const prediction = await model.predict(imageElement);
    
    let highestClass = "";
    let highestProb = 0;

    for (let i = 0; i < maxPredictions; i++) {
      if (prediction[i].probability > highestProb) {
        highestProb = prediction[i].probability;
        highestClass = prediction[i].className;
      }
    }

    const percent = (highestProb * 100).toFixed(0);
    const advice = getAdviceForClass(highestClass);

    if (advice !== null) {
      labelContainer.innerHTML = `
        <div class="badge badge-plastic">✅ ${highestClass} (${percent}%)</div>
        <div class="advice-box">
          <strong>💡 出し方のポイント：</strong><br>
          ${advice}
        </div>
      `;
    } else {
      labelContainer.innerHTML = `
        <div class="badge badge-other">❌ ${highestClass} (${percent}%)</div>
      `;
    }
  }
</script>

</body>
</html>
