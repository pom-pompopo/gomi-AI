<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プラごみ品目別 AI判別＆出し方ガイド</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f4f7f6;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: white;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    #webcam-container canvas {
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }
    .btn {
      background: #008080;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin: 15px 0;
    }
    .result-box {
      margin-top: 15px;
      text-align: left;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
    }
    .badge-plastic {
      background-color: #e6f4f1;
      color: #008080;
    }
    .badge-other {
      background-color: #fde8e8;
      color: #e63946;
    }
    .advice-box {
      background-color: #fff9e6;
      border-left: 4px solid #f59e0b;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.6;
      color: #4a3b00;
      margin-top: 10px;
    }
    .advice-box strong {
      color: #b45309;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>♻️ プラごみ品目別 AI判別カメラ</h2>
  <p>カメラにごみをかざすと、品目の判定と出し方の注意点が表示されます。</p>
  
  <button type="button" class="btn" onclick="init()">📷 カメラを起動する</button>
  
  <div id="webcam-container"></div>
  <div id="label-container" class="result-box"></div>
</div>

<!-- TensorFlow.js と Teachable Machine ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
  // ★ ご自身のTeachable MachineモデルURLに書き換えてください（末尾のスラッシュ / を忘れずに）
  const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_URL_HERE/";

  let model, webcam, labelContainer, maxPredictions;

  async function init() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    const flip = false;
    webcam = new tmImage.Webcam(300, 300, flip);
    await webcam.setup({ facingMode: "environment" });
    await webcam.play();
    window.requestAnimationFrame(loop);

    document.getElementById("webcam-container").innerHTML = "";
    document.getElementById("webcam-container").appendChild(webcam.canvas);
    labelContainer = document.getElementById("label-container");
  }

  async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
  }

  // ★ 品目ごとの注意事項を判定・取得する関数
  function getAdviceForClass(className) {
    const name = className.toLowerCase();

    if (name.includes("dvd")) {
      return "本体・ケースとともに「プラスチックの日」に出してください。";
    }
    if (name.includes("cd") || name.includes("co")) {
      return "本体・ケースとともに「プラスチックの日」に出してください。";
    }
    if (name.includes("ラップ") || name.includes("wrap")) {
      return "水で軽くすすぎ、汚れのついていない状態で出してください。<br>⚠️ 汚れが取れない場合は「燃えるゴミ」へ。";
    }
    if (name.includes("マヨネーズ") || name.includes("mayonnaise") || name.includes("mayo")) {
      return "中身を使い切り、水ですすいでください。（チューブをはさみで切ると洗いやすくなります）<br>⚠️ 汚れが取れない場合は「燃えるゴミ」へ。";
    }
    if (name.includes("弁当") || name.includes("bento")) {
      return "水で軽くすすいでから出してください。<br>⚠️ 油やタレなどの汚れが取れない場合は「燃えるゴミ」へ。";
    }
    if (name.includes("キャップ") || name.includes("ラベル") || name.includes("ペットボトル") || name.includes("pet") || name.includes("cap")) {
      return "ペットボトル本体は「資源の日」に出してください。（キャップとラベルはプラスチックの日へ）";
    }
    if (name.includes("プチプチ") || name.includes("緩衝材") || name.includes("bubble")) {
      return "機械への巻き付き防止のため、30cm程度に切断してから出してください。";
    }
    if (name.includes("フォーク") || name.includes("スプーン") || name.includes("fork")) {
      return "プラスチックだけでできているものに限ります。（金属製などの複合素材は不可）";
    }
    if (name.includes("ひも") || name.includes("紐") || name.includes("string") || name.includes("rope")) {
      return "機械への巻き付き防止のため、30cm程度に切断してから出してください。";
    }
    if (name.includes("ハンガー") || name.includes("hanger")) {
      return "プラスチックだけでできているものに限ります。（フック部分などが金属のものは不可）";
    }
    if (name.includes("歯磨き") || name.includes("チューブ") || name.includes("toothpaste") || name.includes("tube")) {
      return "中身を使い切り、水ですすいでください。（チューブをはさみで切ると洗いやすくなります）<br>⚠️ 汚れが取れない場合は「燃えるゴミ」へ。";
    }

    // 上記以外のプラスチック全般の共通案内
    if (name.includes("plastic") || name.includes("プラスチック") || name.includes("プラ")) {
      return "水で軽くすすいで汚れを落として出してください。<br>⚠️ 汚れが取れない場合は「燃えるゴミ」にしてください。";
    }

    // プラスチック以外
    return null;
  }

  async function predict() {
    const prediction = await model.predict(webcam.canvas);
    
    let highestClass = "";
    let highestProb = 0;

    for (let i = 0; i < maxPredictions; i++) {
      if (prediction[i].probability > highestProb) {
        highestProb = prediction[i].probability;
        highestClass = prediction[i].className;
      }
    }

    const percent = (highestProb * 100).toFixed(0);
    const advice = getAdviceForClass(highestClass);

    // プラスチック系の品目と判定された場合（注意事項を表示）
    if (advice !== null) {
      labelContainer.innerHTML = `
        <div class="badge badge-plastic">✅ ${highestClass} (${percent}%)</div>
        <div class="advice-box">
          <strong>💡 出し方のポイント：</strong><br>
          ${advice}
        </div>
      `;
    } else {
      // プラスチック以外と判定された場合（注意書きは非表示）
      labelContainer.innerHTML = `
        <div class="badge badge-other">❌ ${highestClass} (${percent}%)</div>
      `;
    }
  }
</script>

</body>
</html>
