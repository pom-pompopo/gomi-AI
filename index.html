<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プラごみ品目別 AI判別＆出し方ガイド</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background-color: #f0f4f3;
      padding: 15px;
      margin: 0;
      overflow-x: hidden;
    }

    /* --- 🎬 2つの山が左右に分かれるオープニング演出 --- */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      pointer-events: none;
      background-color: #ffffff;
      overflow: hidden;
    }

    /* 左の山（奥の山） */
    .mountain-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 75vw;
      max-width: 600px;
      height: 75vh;
      transition: transform 1.3s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 2;
    }

    /* 右の山（手前の山） */
    .mountain-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 80vw;
      max-width: 650px;
      height: 75vh;
      transition: transform 1.3s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 3;
    }

    /* 左右に移動して退くアニメーション */
    .slide-out-left {
      transform: translateX(-130%) !important;
    }
    .slide-out-right {
      transform: translateX(130%) !important;
    }

    .mountain-svg {
      width: 100%;
      height: 100%;
    }

    /* 中央タイトル */
    .center-title {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      color: #333;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
      transition: opacity 0.5s ease;
      z-index: 10;
    }

    /* --- メインカード --- */
    .card {
      background: white;
      max-width: 480px;
      margin: 15px auto;
      padding: 20px 15px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.8s ease 0.4s, transform 0.8s ease 0.4s;
    }
    .card.show {
      opacity: 1;
      transform: scale(1);
    }

    .tab-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #008080;
      background-color: white;
      color: #008080;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .tab-btn.active {
      background-color: #008080;
      color: white;
    }
    .preview-area {
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9fbfb;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 2px dashed #b2dfdb;
    }
    #webcam-container canvas, #image-preview {
      border-radius: 12px;
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
    }
    .file-input-label {
      display: inline-block;
      padding: 10px 22px;
      background-color: #008080;
      color: white;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    input[type="file"] {
      display: none;
    }
    .loading-text {
      font-size: 14px;
      color: #666;
    }
    .result-box {
      margin-top: 15px;
      text-align: left;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
    }
    .badge-plastic {
      background-color: #e6f4f1;
      color: #008080;
    }
    .badge-other {
      background-color: #fde8e8;
      color: #e63946;
    }
    .advice-box {
      background-color: #fff9e6;
      border-left: 4px solid #f59e0b;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      color: #4a3b00;
      margin-top: 10px;
    }
    .advice-box strong {
      color: #b45309;
    }
  </style>
</head>
<body>

<!-- 🎬 2つのゴミ山オープニング演出 -->
<div id="intro-overlay">
  <div class="center-title" id="center-title">♻️ ごみの山から正しく分別！</div>

  <!-- ① 左に移動するゴミ山 -->
  <div class="mountain-left" id="mountain-left">
    <svg class="mountain-svg" viewBox="0 0 500 500" preserveAspectRatio="none">
      <!-- 左側の山体 -->
      <path d="M-50,500 L-50,380 Q40,280 180,120 Q280,10 380,150 Q480,260 550,500 Z" fill="#6d5843"/>
      <path d="M-50,500 L-50,400 Q60,300 200,160 Q290,60 390,190 Q470,300 520,500 Z" fill="#846d53"/>

      <!-- 青いポリタンク（頂上付近） -->
      <rect x="290" y="50" width="45" height="55" rx="8" fill="#3a86c8" transform="rotate(-20 290 50)"/>
      <line x1="295" y1="75" x2="330" y2="75" stroke="#2563eb" stroke-width="4" transform="rotate(-20 290 50)"/>
      
      <!-- 緑のドラム缶 -->
      <g transform="translate(140, 160) rotate(25)">
        <rect x="0" y="0" width="80" height="110" rx="15" fill="#4d8b55"/>
        <line x1="0" y1="35" x2="80" y2="35" stroke="#37683e" stroke-width="4"/>
        <line x1="0" y1="75" x2="80" y2="75" stroke="#37683e" stroke-width="4"/>
      </g>
      
      <!-- 洗濯機・家電 -->
      <rect x="310" y="160" width="75" height="75" rx="8" fill="#e2e8f0" transform="rotate(-15 310 160)"/>
      <circle cx="345" cy="195" r="20" fill="#94a3b8"/>
      
      <!-- タンス（家具） -->
      <g transform="translate(340, 260) rotate(20)">
        <rect x="0" y="0" width="90" height="90" fill="#b07d48" stroke="#84592b" stroke-width="4"/>
        <line x1="0" y1="30" x2="90" y2="30" stroke="#84592b" stroke-width="3"/>
        <line x1="0" y1="60" x2="90" y2="60" stroke="#84592b" stroke-width="3"/>
        <circle cx="45" cy="15" r="4" fill="#523415"/>
        <circle cx="45" cy="45" r="4" fill="#523415"/>
        <circle cx="45" cy="75" r="4" fill="#523415"/>
      </g>

      <!-- タイヤ・赤ポリタンク -->
      <ellipse cx="130" cy="300" rx="35" ry="25" fill="#1e293b"/>
      <rect x="30" y="360" width="55" height="65" rx="10" fill="#c84b31" transform="rotate(15 30 360)"/>

      <!-- 散らばる空き缶・ビン -->
      <rect x="380" y="440" width="22" height="14" rx="4" fill="#2563eb" transform="rotate(45 380 440)"/>
      <rect x="420" y="450" width="22" height="14" rx="4" fill="#dc2626" transform="rotate(-30 420 450)"/>
      <rect x="200" y="460" width="24" height="14" rx="4" fill="#0d9488" transform="rotate(15 200 460)"/>
      <rect x="90" y="460" width="70" height="15" rx="5" fill="#544026"/>
    </svg>
  </div>

  <!-- ② 右に移動するゴミ山 -->
  <div class="mountain-right" id="mountain-right">
    <svg class="mountain-svg" viewBox="0 0 550 500" preserveAspectRatio="none">
      <!-- 右側の山体（手前） -->
      <path d="M-50,500 L-50,420 Q80,260 220,120 Q320,10 420,160 Q530,280 600,500 Z" fill="#7a624a"/>
      <path d="M-50,500 L-50,440 Q100,280 240,150 Q340,40 430,190 Q520,320 580,500 Z" fill="#91775b"/>

      <!-- 青いポリタンク（頂上付近） -->
      <rect x="150" y="60" width="45" height="55" rx="8" fill="#3a86c8" transform="rotate(15 150 60)"/>
      <line x1="155" y1="85" x2="190" y2="85" stroke="#2563eb" stroke-width="4" transform="rotate(15 150 60)"/>

      <!-- 白い家電 -->
      <rect x="230" y="160" width="75" height="75" rx="8" fill="#f1f5f9" transform="rotate(20 230 160)"/>
      <circle cx="265" cy="195" r="20" fill="#cbd5e1"/>

      <!-- タンス（家具） -->
      <g transform="translate(140, 240) rotate(-20)">
        <rect x="0" y="0" width="100" height="90" fill="#b07d48" stroke="#84592b" stroke-width="4"/>
        <line x1="0" y1="30" x2="100" y2="30" stroke="#84592b" stroke-width="3"/>
        <line x1="0" y1="60" x2="100" y2="60" stroke="#84592b" stroke-width="3"/>
        <circle cx="50" cy="15" r="4" fill="#523415"/>
        <circle cx="50" cy="45" r="4" fill="#523415"/>
        <circle cx="50" cy="75" r="4" fill="#523415"/>
      </g>

      <!-- 緑のドラム缶 -->
      <g transform="translate(370, 180) rotate(-25)">
        <rect x="0" y="0" width="80" height="110" rx="15" fill="#529b5c"/>
        <line x1="0" y1="35" x2="80" y2="35" stroke="#37683e" stroke-width="4"/>
        <line x1="0" y1="75" x2="80" y2="75" stroke="#37683e" stroke-width="4"/>
      </g>

      <!-- タイヤ・赤ポリタンク -->
      <ellipse cx="90" cy="240" rx="35" ry="25" fill="#1e293b" transform="rotate(35 90 240)"/>
      <ellipse cx="480" cy="340" rx="30" ry="20" fill="#0f172a"/>
      <rect x="490" y="400" width="55" height="65" rx="10" fill="#c84b31" transform="rotate(-15 490 400)"/>

      <!-- 散らばる缶・ペットボトル・ビン -->
      <rect x="70" y="440" width="22" height="14" rx="4" fill="#2563eb" transform="rotate(-20 70 440)"/>
      <rect x="130" y="450" width="20" height="12" rx="3" fill="#16a34a"/>
      <rect x="180" y="455" width="22" height="14" rx="4" fill="#dc2626"/>
      <rect x="250" y="450" width="15" height="45" rx="4" fill="#65a30d" transform="rotate(90 250 450)"/>
      <rect x="360" y="450" width="20" height="12" rx="3" fill="#16a34a"/>
      <rect x="400" y="460" width="70" height="15" rx="5" fill="#544026"/>
    </svg>
  </div>
</div>

<!-- 📱 メインカード -->
<div class="card" id="main-card">
  <h2>♻️ プラごみ AI判別ガイド</h2>
  <p style="font-size:13px; color:#666;">カメラまたは画像から分別区分を判定します。</p>

  <div class="tab-container">
    <button class="tab-btn active" id="tab-camera" onclick="switchMode('camera')">📷 カメラで判定</button>
    <button class="tab-btn" id="tab-upload" onclick="switchMode('upload')">📁 画像を選んで判定</button>
  </div>

  <div id="camera-section">
    <div class="preview-area">
      <div id="loading" class="loading-text">📷 AIモデルとカメラを読み込み中...</div>
      <div id="webcam-container"></div>
    </div>
  </div>

  <div id="upload-section" style="display: none;">
    <label class="file-input-label">
      📁 画像を選択または撮影
      <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)">
    </label>
    <div class="preview-area">
      <img id="image-preview" src="" alt="画像プレビュー" style="display: none;">
      <span id="upload-placeholder" class="loading-text">画像ファイルを選択してください</span>
    </div>
  </div>

  <div id="label-container" class="result-box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
  // ★ ご自身のTeachable MachineモデルURLをここに貼り付けてください（末尾のスラッシュ / を忘れずに）
  const URL = "https://teachablemachine.withgoogle.com/models/fQsdyrL7J/";

  let model, webcam, labelContainer, maxPredictions;
  let isCameraActive = false;

  // 画面ロード時に演出を実行（左の山は左へ、右の山は右へスライド）
  window.onload = function() {
    setTimeout(function() {
      const mLeft = document.getElementById("mountain-left");
      const mRight = document.getElementById("mountain-right");
      const title = document.getElementById("center-title");
      const mainCard = document.getElementById("main-card");

      if (title) title.style.opacity = "0";

      // 1つの山は左へ、もう1つの山は右へ退く
      if (mLeft) mLeft.classList.add("slide-out-left");
      if (mRight) mRight.classList.add("slide-out-right");
      if (mainCard) mainCard.classList.add("show");

      setTimeout(function() {
        const overlay = document.getElementById("intro-overlay");
        if (overlay) overlay.style.display = "none";
      }, 1400);
    }, 800);

    initModel();
  };

  async function initModel() {
    try {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();
      labelContainer = document.getElementById("label-container");

      startCamera();
    } catch (err) {
      document.getElementById("loading").innerHTML = "⚠️ モデルの読み込みに失敗しました。<br>URL設定を確認してください。";
      console.error(err);
    }
  }

  async function startCamera() {
    try {
      isCameraActive = true;
      const flip = false;
      webcam = new tmImage.Webcam(300, 300, flip);
      await webcam.setup({ facingMode: "environment" });
      await webcam.play();
      window.requestAnimationFrame(loopCamera);

      document.getElementById("loading").style.display = "none";
      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("webcam-container").appendChild(webcam.canvas);
    } catch (err) {
      document.getElementById("loading").innerHTML = "⚠️ カメラが起動できませんでした。<br>カメラの許可を確認してください。";
      console.error(err);
    }
  }

  async function loopCamera() {
    if (!isCameraActive) return;
    webcam.update();
    await predict(webcam.canvas);
    window.requestAnimationFrame(loopCamera);
  }

  function switchMode(mode) {
    const tabCam = document.getElementById("tab-camera");
    const tabUp = document.getElementById("tab-upload");
    const secCam = document.getElementById("camera-section");
    const secUp = document.getElementById("upload-section");
    labelContainer.innerHTML = "";

    if (mode === "camera") {
      tabCam.classList.add("active");
      tabUp.classList.remove("active");
      secCam.style.display = "block";
      secUp.style.display = "none";
      if (!isCameraActive) {
        startCamera();
      }
    } else {
      tabCam.classList.remove("active");
      tabUp.classList.add("active");
      secCam.style.display = "none";
      secUp.style.display = "block";
      isCameraActive = false;
      if (webcam) webcam.stop();
    }
  }

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const imgPreview = document.getElementById("image-preview");
    const placeholder = document.getElementById("upload-placeholder");
    const reader = new FileReader();

    reader.onload = function(e) {
      imgPreview.src = e.target.result;
      imgPreview.style.display = "block";
      placeholder.style.display = "none";

      imgPreview.onload = async function() {
        await predict(imgPreview);
      };
    };
    reader.readAsDataURL(file);
  }

  function getAdviceForClass(className) {
    const name = className.toLowerCase();

    if (name.includes("dvd") || name.includes("cd") || name.includes("co")) {
      return "プラスチックのみ・30cm未満であれば「プラスチック」の日へ。<br>（汚れがない状態で出してください）";
    }
    if (name.includes("ラップ") || name.includes("wrap")) {
      return "水で軽くすすぎ、汚れのない状態で「プラスチック」へ。<br>⚠️ 汚れが取れない場合は「可燃ごみ」へ。";
    }
    if (name.includes("マヨネーズ") || name.includes("mayonnaise") || name.includes("mayo")) {
      return "中身を使い切り、水ですすいで出してください。<br>⚠️ 汚れが取れない場合は「可燃ごみ」へ。";
    }
    if (name.includes("弁当") || name.includes("bento")) {
      return "【30cm未満・プラ単体・汚れなし】であれば「プラスチック」へ。<br>⚠️ 汚れが落ちない・ゴムパッキン等が外れない場合は「可燃ごみ」へ。";
    }
    if (name.includes("キャップ") || name.includes("ラベル") || name.includes("pet") || name.includes("cap")) {
      return "キャップ・ラベルは「プラスチック」へ。<br>ボトル本体は「資源（ペットボトル）」へ。";
    }
    if (name.includes("プチプチ") || name.includes("緩衝材") || name.includes("bubble")) {
      return "機械への巻き付き防止のため、30cm程度に切断して「プラスチック」へ。";
    }
    if (name.includes("フォーク") || name.includes("スプーン") || name.includes("fork")) {
      return "プラスチック100%素材に限ります。（金属等の複合素材は不可）";
    }
    if (name.includes("ひも") || name.includes("紐") || name.includes("string") || name.includes("rope")) {
      return "機械への巻き付き防止のため、30cm程度に切断して「プラスチック」へ。";
    }
    if (name.includes("ハンガー") || name.includes("hanger")) {
      return "プラスチック単体で30cm未満のものに限ります。（フックが金属のものは不可）";
    }
    if (name.includes("歯磨き") || name.includes("チューブ") || name.includes("tube")) {
      return "中身を使い切り、水ですすいで出してください。<br>⚠️ 汚れが取れない場合は「可燃ごみ」へ。";
    }
    if (name.includes("plastic") || name.includes("プラスチック") || name.includes("プラ")) {
      return "水ですすいで汚れを落として「プラスチック」へ。<br>⚠️ 汚れが取れない場合は「可燃ごみ」へ。";
    }
    return null;
  }

  async function predict(imageElement) {
    const prediction = await model.predict(imageElement);
    
    let highestClass = "";
    let highestProb = 0;

    for (let i = 0; i < maxPredictions; i++) {
      if (prediction[i].probability > highestProb) {
        highestProb = prediction[i].probability;
        highestClass = prediction[i].className;
      }
    }

    const percent = (highestProb * 100).toFixed(0);
    const advice = getAdviceForClass(highestClass);

    if (advice !== null) {
      labelContainer.innerHTML = `
        <div class="badge badge-plastic">✅ ${highestClass} (${percent}%)</div>
        <div class="advice-box">
          <strong>💡 出し方のポイント：</strong><br>
          ${advice}
        </div>
      `;
    } else {
      labelContainer.innerHTML = `
        <div class="badge badge-other">❌ ${highestClass} (${percent}%)</div>
      `;
    }
  }
</script>

</body>
</html>
